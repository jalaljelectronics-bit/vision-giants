

services:
  postgres:
    image: postgres:16
    container_name: vg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: vision_giants
    ports:
      - "5433:5432"
    volumes:
      - vg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build: .
    container_name: vg-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password123}@postgres:5432/vision_giants
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 4000
      NODE_ENV: production
    command: sh -c "node src/db/migrate.js && node src/server.js"

volumes:
  vg-pgdata: